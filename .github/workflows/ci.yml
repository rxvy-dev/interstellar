name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-vte-3.91 xvfb make dbus-x11
      - name: Unit tests
        run: make test PYTHON=/usr/bin/python3
      - name: Doctor
        run: make check PYTHON=/usr/bin/python3
      - name: Starts without errors
        run: |
          export GDK_BACKEND=x11 GSK_RENDERER=cairo NO_AT_BRIDGE=1 GTK_A11Y=none
          timeout 8 xvfb-run -a ./bin/interstellar --no-restore > log.txt 2>&1 || true
          cat log.txt
          # real Python errors only: GTK / D-Bus warnings on a headless runner mention "Error" harmlessly
          if grep -nE "Traceback|^[A-Za-z_.]*(Error|Exception):" log.txt; then
            grep -nE "Traceback|^[A-Za-z_.]*(Error|Exception):" log.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Build .deb
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: interstellar-deb
          path: dist/*.deb
